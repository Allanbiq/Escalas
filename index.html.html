<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Escalas e Folgas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fa;--fg:#1b2430;--mut:#5d6b7c;--card:#fff;--bd:#d8dee6;--pri:#1d5fd1;--w:#e3f5ea;--wf:#14693a;--o:#fde6ea;--of:#a4203a;--h:#e0ecff;--hf:#164aa8;--s:#fff0d6;--sf:#8a5200;--n:#eceff3;--nf:#5d6b7c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--fg:#e8edf3;--mut:#9aa7b6;--card:#1b222b;--bd:#2d3744;--pri:#6ea0ff;--w:#173625;--wf:#7fdca2;--o:#40202a;--of:#ff9db0;--h:#1a2d52;--hf:#9bbfff;--s:#43330f;--sf:#ffcf7a;--n:#262e38;--nf:#9aa7b6}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--fg:#e8edf3;--mut:#9aa7b6;--card:#1b222b;--bd:#2d3744;--pri:#6ea0ff;--w:#173625;--wf:#7fdca2;--o:#40202a;--of:#ff9db0;--h:#1a2d52;--hf:#9bbfff;--s:#43330f;--sf:#ffcf7a;--n:#262e38;--nf:#9aa7b6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px;cursor:pointer}header span{flex:1}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}button.b2{background:transparent;color:var(--pri);border:1px solid var(--pri)}button.sm{padding:4px 9px;font-size:14px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
.big{font-size:20px;padding:14px}.mut{color:var(--mut);font-size:14px}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .hd{text-align:center;font-size:12px;color:var(--mut)}
.d{border-radius:8px;min-height:62px;padding:4px;font-size:12px;border:2px solid transparent;cursor:pointer;overflow:hidden;background:var(--n);color:var(--nf)}
.d b{display:block;font-size:15px}.d.work{background:var(--w);color:var(--wf)}.d.off{background:var(--o);color:var(--of)}.d.hol{background:var(--h);color:var(--hf)}.d.spec{background:var(--s);color:var(--sf)}.d.sel{border-color:var(--fg)}.d.today{outline:2px dashed var(--pri)}
.lg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.lg span{padding:3px 9px;border-radius:12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}.wrap{overflow-x:auto}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.md{background:var(--card);border-radius:12px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;margin:1px}.warn{background:var(--s);color:var(--sf);padding:10px;border-radius:8px;font-size:14px;margin-bottom:12px}
.d.abs{background:#ece0fa;color:#56288a}@media (prefers-color-scheme:dark){.d.abs{background:#33224d;color:#d3b8ff}}
@media(max-width:520px){.d{min-height:52px;font-size:11px}}
</style></head><body>
<header><b onclick="go('home')">🗓️ Escalas e Folgas</b><span></span><button class="b2 sm" onclick="go('pub')">Consulta</button><button class="b2 sm" onclick="go('adm')">Administração</button></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],DSL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dn=(y,m,d)=>Date.UTC(y,m,d)/864e5,P=s=>s.split('-').map(Number),dnI=s=>{const[a,b,c]=P(s);return dn(a,b-1,c)},fromN=n=>{const t=new Date(n*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())},br=s=>{const[a,b,c]=P(s);return pad(c)+'/'+pad(b)+'/'+a};
const T=new Date(),TODAY=T.getFullYear()+'-'+pad(T.getMonth()+1)+'-'+pad(T.getDate()),mod=(a,b)=>((a%b)+b)%b;
let S={emps:[],evs:[],hol:[],log:[]},db=null,can=true,v='home',tab='dash',cur={eid:null,off:0,list:false,sel:null,q:''},ed=null,hits=[],fl={sec:'',shift:'',q:''};
const uid=()=>Math.random().toString(36).slice(2,9);
/* ===== MOTOR DE ESCALAS ===== */
function baseStatus(e,n,dow){
 if(e.sun==='fixa')return dow===0?'off':'work';
 if(dow===0&&e.sun&&e.sun!=='none'){const cy=e.sun==='2x1'?['W','W','F']:e.sun==='1x1'?['W','F']:(e.cyc||'W').split(',').map(x=>x.trim().toUpperCase()[0]);
  let r=dnI(e.ref||e.start);r-=new Date(r*864e5).getUTCDay();return cy[mod(Math.floor((n-r)/7),cy.length)]==='F'?'off':'work'}
 if(e.pat==='cycle'){const a=+e.work||5,b=+e.rest||2;return mod(n-dnI(e.start),a+b)<a?'work':'off'}
 return dow===+e.off?'off':'work'}
function status(e,iso){
 if(!e.start||iso<e.start)return{k:'none',t:'— Sem informação'};
 const[y,m,d]=P(iso),n=dn(y,m-1,d),dow=new Date(n*864e5).getUTCDay();
 const ev=S.evs.find(x=>x.eid===e.id&&x.date===iso&&!x.cancelled);
 if(ev){if(ev.type==='hol')return{k:'hol',t:'FF Folga de feriado',ev};if(ev.type==='spec')return{k:'spec',t:'H Horário especial',ev};if(ev.type==='fer')return{k:'abs',t:'FE Férias',ev};if(ev.type==='ate')return{k:'abs',t:'AF Afastamento',ev};if(ev.type==='off')return{k:'off',t:'F Folga (ajuste)',ev};if(ev.type==='work')return{k:'work',t:'T Trabalho (ajuste)',ev}}
 const b=baseStatus(e,n,dow);return b==='off'?{k:'off',t:'F Folga'+(dow===0?' de domingo':' semanal')}:{k:'work',t:'T Trabalho'}}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const act=()=>S.emps.filter(e=>e.active!==false);
/* ===== PERSISTÊNCIA ===== */
async function load(){
 try{db=await claude.use('db');const u=await claude.use('user');if(db&&u){can=await u.canEdit();const s=await db.doc('app/state').get();if(s.exists){S=JSON.parse(s.data().json)}else if(can)seed()}}catch(x){db=null}
 if(!db){try{const j=localStorage.getItem('escalas');if(j)S=JSON.parse(j);else seed()}catch(x){seed()}can=true}
 render()}
function seed(){S.emps=[{id:uid(),name:'João Felipe (exemplo)',reg:'1001',sector:'Padaria',shift:'manhã',in:'06:00',lunch:'10:00',ret:'11:00',out:'14:20',off:4,sun:'2x1',ref:'2026-10-04',pat:'weekly',start:'2026-09-01',active:true},{id:uid(),name:'Maria Souza (exemplo)',reg:'1002',sector:'Açougue',shift:'tarde',in:'12:00',lunch:'16:00',ret:'17:00',out:'20:20',off:2,sun:'1x1',ref:'2026-10-04',pat:'weekly',start:'2026-09-01',active:true}]}
async function save(msg){if(msg)S.log.push({t:new Date().toISOString(),msg});S.log=S.log.slice(-300);
 try{if(db)await db.doc('app/state').set({json:JSON.stringify(S)});else localStorage.setItem('escalas',JSON.stringify(S))}catch(x){alert('Não foi possível salvar: '+(x.message||x))}render()}
function ask(msg){return new Promise(r=>{const d=document.createElement('div');d.className='ov';d.innerHTML='<div class=md><div>'+msg+'</div><div class=row style="margin-top:14px"><button class=b2 id=n>Cancelar</button><button id=y>Confirmar</button></div></div>';document.body.append(d);d.querySelector('#y').onclick=()=>{d.remove();r(1)};d.querySelector('#n').onclick=()=>{d.remove();r(0)}})}
function go(x){v=x;cur.sel=null;if(x==='pub'){cur.eid=null;cur.off=0}render();scrollTo(0,0)}
/* ===== CALENDÁRIO ===== */
const LG='<div class=lg><span class="d work">T Trabalho</span><span class="d off">F Folga</span><span class="d hol">FF Folga de feriado</span><span class="d abs">FE Férias</span><span class="d abs">AF Afastamento</span><span class="d">— Sem informação</span></div>'.replace(/class="d /g,'style="min-height:0;cursor:default" class="d ');
function nextOff(e){for(let i=0;i<190;i++){const s=fromN(dnI(TODAY)+i),st=status(e,s);if(st.k==='off'||st.k==='hol')return{s,st}}}
function hrs(e,st){const x=st.ev&&st.ev.type==='spec'?st.ev:e;return st.k==='off'||st.k==='hol'||st.k==='abs'?'':`Entrada ${x.in||'—'} · Intervalo ${x.lunch||'—'} · Retorno ${x.ret||'—'} · Saída ${x.out||'—'}`}
function cal(e,lim){
 const t=new Date(T.getFullYear(),T.getMonth()+cur.off,1),y=t.getFullYear(),m=t.getMonth(),nd=new Date(y,m+1,0).getDate(),first=t.getDay();
 let h=`<div class=row style="margin:8px 0"><button class=b2 ${cur.off<=lim[0]?'disabled':''} onclick="mv(-1)">◀</button><b style="text-align:center">${MES[m]} ${y}</b><button class=b2 ${cur.off>=lim[1]?'disabled':''} onclick="mv(1)">▶</button><button class=b2 onclick="cur.list=!cur.list;render()">${cur.list?'Ver grade':'Ver lista'}</button></div>`;
 const no=nextOff(e);if(no)h+=`<div class=card style="padding:10px">Próxima folga: <b>${DS[new Date(dnI(no.s)*864e5).getUTCDay()]}, ${br(no.s)}</b> (${no.st.t.replace(/^\S+ /,'')})</div>`;
 if(cur.list){h+='<div class=card>';for(let d=1;d<=nd;d++){const s=y+'-'+pad(m+1)+'-'+pad(d),st=status(e,s);h+=`<div class="d ${st.k}" style="min-height:0;margin:3px 0;display:flex;justify-content:space-between" onclick="cur.sel='${s}';render()"><span>${DS[new Date(y,m,d).getDay()]} ${pad(d)}/${pad(m+1)}</span><span>${st.t}</span></div>`}h+='</div>'}
 else{h+='<div class=cal>'+DS.map(x=>`<div class=hd>${x}</div>`).join('')+'<div></div>'.repeat(first);for(let d=1;d<=nd;d++){const s=y+'-'+pad(m+1)+'-'+pad(d),st=status(e,s);h+=`<div class="d ${st.k} ${cur.sel===s?'sel':''} ${s===TODAY?'today':''}" onclick="cur.sel='${s}';render()"><b>${d}</b>${st.t.split(' ')[0]}</div>`}h+='</div>'}
 h+=LG;if(cur.sel){const st=status(e,cur.sel);h+=`<div class=card><b>${DSL[new Date(dnI(cur.sel)*864e5).getUTCDay()]}, ${br(cur.sel)}</b><br>${st.t}<br><span class=mut>${hrs(e,st)}${st.ev&&st.ev.reason?'<br>Motivo: '+esc(st.ev.reason):''}</span></div>`}return h}
function mv(d){cur.off+=d;cur.sel=null;render()}
/* ===== ÁREA PÚBLICA ===== */
let pt='mine';
function pubTabs(){return `<div class=tabs><button class="${pt==='mine'?'':'b2'}" onclick="pt='mine';render()">Minha escala</button><button class="${pt==='mes'?'':'b2'}" onclick="pt='mes';render()">Escala mensal</button></div>`}
function pubV(){
 if(pt==='mes')return pubTabs()+mesV();
 if(cur.eid){const e=S.emps.find(x=>x.id===cur.eid);return `<button class=b2 onclick="cur.eid=null;cur.sel=null;render()">← Nova busca</button><h2>${esc(e.name)}</h2><div class=mut>${esc(e.sector)} · turno ${esc(e.shift)}</div>`+(()=>{const l=S.evs.filter(x=>x.eid===e.id&&x.type==='hol'&&!x.cancelled&&x.date>=TODAY).sort((a,b)=>a.date<b.date?-1:1);return l.length?'<div class=warn style="font-size:17px;font-weight:700;text-align:center;border:2px solid var(--sf);margin-top:12px">ATENÇÃO, LANÇAR FOLGA DE FERIADO NO PORTAL ANTES DA FOLGA !!<div style="font-size:14px;font-weight:400">Folga de feriado em '+l.map(x=>br(x.date)).join(', ')+'</div></div>':''})()+cal(e,[-1,5])}
 return pubTabs()+`<div class=card><h2>Consulte sua escala</h2><input class=big id=q placeholder="Digite seu nome ou número de cadastro" value="${esc(cur.q)}" oninput="srch(this.value)" autofocus><div id=res>${resH()}</div></div>`}
function resH(){return hits.map(e=>`<div class=card style="margin:8px 0;cursor:pointer" onclick="cur.eid='${e.id}';cur.off=0;render()"><b>${esc(e.name)}</b><div class=mut>${esc(e.sector)} · ${esc(e.shift)}</div></div>`).join('')||(cur.q.length>1?'<p class=mut>Nenhum resultado.</p>':'')}
let hist=[];
function srch(q){cur.q=q;const now=Date.now();hist=hist.filter(t=>now-t<6e4);if(hist.length>=25){$('#res').innerHTML='<p class=mut>Muitas consultas. Aguarde um minuto.</p>';return}hist.push(now);
 const n=norm(q).trim();hits=n.length<2?[]:act().filter(e=>norm(e.name).includes(n)||String(e.reg)===q.trim()).slice(0,12);$('#res').innerHTML=resH()}
/* ===== ADMIN ===== */
const TABS={dash:'Painel',mes:'Escala Mensal',esc:'Escalas',emps:'Colaboradores',hol:'Folgas de Feriados',sun:'Domingos',log:'Histórico'};
function admV(){
 if(!can)return '<div class=card><h2>Acesso restrito</h2><p>Somente administradores com permissão de edição neste artefato podem usar esta área.</p></div>';
 let h=(db?'':'<div class=warn>Modo local: os dados ficam salvos apenas neste navegador. Veja as limitações informadas na entrega.</div>')+'<div class=tabs>'+Object.entries(TABS).map(([k,n])=>`<button class="${tab===k?'':'b2'}" onclick="tab='${k}';ed=null;cur.sel=null;render()">${n}</button>`).join('')+'</div>';
 return h+({dash,mes:mesV,esc:escV,emps:empsV,hol:holV,sun:sunV,hrs:hrsV,log:logV,data:dataV}[tab])()}
function dash(){
 const a=act(),cnt=k=>Object.entries(a.reduce((o,e)=>(o[e[k]||'—']=(o[e[k]||'—']||0)+1,o),{})).map(([x,n])=>`<span class=pill style="background:var(--n)">${esc(x)}: ${n}</span>`).join('');
 const inc=(S.hol||[]).slice().sort((p,q)=>p.date<q.date?-1:1).flatMap(f=>{hd=f.date;return (f.ws||[]).map(id=>S.emps.find(e=>e.id===id)).filter(e=>e&&!lancs(e.id).length&&!sk(e.id)).map(e=>`${br(f.date)} · ${esc(e.name)} <span class=mut>(até ${br(dl(f.date))})</span>`)});hd='';
 const comp=S.evs.filter(x=>x.type==='hol'&&!x.cancelled&&x.date>=TODAY).sort((p,q)=>p.date<q.date?-1:1).slice(0,6).map(x=>`${br(x.date)} · ${esc(nm(x.eid))}`);
 return `<div class=grid><div class=card><h3>${a.length} colaboradores ativos</h3><div>${cnt('sector')}</div><div>${cnt('shift')}</div></div><div class=card><h3>Próximas folgas compensatórias</h3>${comp.join('<br>')||'<span class=mut>Nenhuma</span>'}</div><div class=card><h3>Próximos feriados</h3>${S.hol.filter(x=>x.date>=TODAY).sort((p,q)=>p.date<q.date?-1:1).slice(0,5).map(x=>br(x.date)+' · '+esc(x.name)).join('<br>')||'<span class=mut>Nenhum</span>'}</div><div class=card><h3>Folgas pendentes (${inc.length})</h3>${inc.join('<br>')||'<span class=mut>Nenhuma</span>'}</div><div class=card><h3>Alterações recentes</h3>${S.log.slice(-5).reverse().map(l=>`<div class=mut>${new Date(l.t).toLocaleString('pt-BR')} · ${esc(l.msg)}</div>`).join('')||'<span class=mut>—</span>'}</div></div>
 <div class=row><button onclick="tab='emps';ed={};render()">+ Colaborador</button><button class=b2 onclick="tab='esc';render()">Consultar escala</button><button class=b2 onclick="tab='hol';render()">Lançar folga de feriado</button><button class=b2 onclick="tab='sun';render()">Folgas de domingo</button></div>`}
const nm=id=>(S.emps.find(e=>e.id===id)||{}).name||'(removido)';
function escV(){const a=act();if(!cur.eid||!S.emps.find(e=>e.id===cur.eid))cur.eid=a[0]&&a[0].id;const e=S.emps.find(x=>x.id===cur.eid);if(!e)return '<div class=card>Cadastre um colaborador.</div>';
 return `<select onchange="cur.eid=this.value;render()">${a.map(x=>`<option value="${x.id}" ${x.id===cur.eid?'selected':''}>${esc(x.reg)} · ${esc(x.name)}</option>`).join('')}</select>`+cal(e,[-12,12])}
const fld=(l,id,val,t)=>t==='date'?`<div><label>${l}</label>${dp(id,val)}</div>`:`<div><label>${l}</label><input id="${id}" type="${t||'text'}" value="${esc(val)}"></div>`,sel=(l,id,val,o)=>`<div><label>${l}</label><select id="${id}">${o.map(([k,n])=>`<option value="${k}" ${String(k)===String(val)?'selected':''}>${n}</option>`).join('')}</select></div>`;
function empsV(){
 if(ed){const e=ed;return `<div class=card><h3>${e.id?'Editar':'Novo'} colaborador</h3><div class=row>${fld('Nome completo','f_name',e.name)}${fld('Matrícula (única)','f_reg',e.reg)}${sel('Setor','f_sector',e.sector||'',[...(e.sector?[]:[['','Selecione...']]),...['Loja','Processados','Depósito','Floricultura'].map(x=>[x,x]),...(e.sector&&!['Loja','Processados','Depósito','Floricultura'].includes(e.sector)?[[e.sector,e.sector]]:[])])}${sel('Turno','f_shift',e.shift||'manhã',[['manhã','Manhã'],['tarde','Tarde'],['madrugada','Madrugada']])}</div><div class=row>${fld('Entrada','f_in',e.in,'time')}${fld('Intervalo','f_lunch',e.lunch,'time')}${fld('Retorno','f_ret',e.ret,'time')}${fld('Saída','f_out',e.out,'time')}</div><div class=row>${sel('Padrão','f_pat',e.pat||'weekly',[['weekly','Folga semanal fixa'],['cycle','Ciclo (ex.: 5x2)']])}${sel('Dia de folga fixa (não vale para domingo fixo)','f_off',e.off??4,DSL.map((d,i)=>[i,d]))}${fld('Dias de trabalho (ciclo)','f_work',e.work||5,'number')}${fld('Dias de descanso (ciclo)','f_rest',e.rest||2,'number')}</div><div class=row>${sel('Ciclo de domingo','f_sun',e.sun||'none',[['none','Sem regra de domingo'],['2x1','2x1 (2 trabalha, 1 folga)'],['1x1','1x1 (alternado)'],['fixa','Folga de domingo fixa (todo domingo)']])}<input type="hidden" id="f_cyc" value="${esc(e.cyc||'T,T,F')}">${fld('Domingo de referência (posição 1 do ciclo)','f_ref',e.ref,'date')}${fld('Início da escala','f_start',e.start,'date')}</div><div class=row>${sel('Situação','f_act',e.active===false?'0':'1',[['1','Ativo'],['0','Inativo']])}${fld('Observações','f_obs',e.obs)}</div><div class=row style="margin-top:12px"><button onclick="saveEmp()">Salvar</button><button class=b2 onclick="ed=null;render()">Cancelar</button></div></div>`}
 return `<button onclick="ed={}; render()">+ Novo colaborador</button><div class="card wrap" style="margin-top:12px"><table><tr><th>Mat.</th><th>Nome</th><th>Setor</th><th>Turno</th><th>Regra</th><th></th></tr>${S.emps.map(e=>`<tr style="${e.active===false?'opacity:.5':''}"><td>${esc(e.reg)}</td><td>${esc(e.name)}</td><td>${esc(e.sector)}</td><td>${esc(e.shift)}</td><td>${e.sun==='fixa'?'Domingo fixo':(e.pat==='cycle'?(e.work+'x'+e.rest):DS[e.off])+' · dom '+e.sun}</td><td><button class="b2 sm" onclick="ed=S.emps.find(x=>x.id==='${e.id}');render()">Editar</button> <button class="b2 sm" style="color:var(--of);border-color:var(--of)" onclick="delEmp('${e.id}')">Excluir</button> <button class="b2 sm" onclick="ausDlg('${e.id}')">Lançar férias/atestado</button></td></tr>`).join('')}</table></div>`}

async function addSpec(){const d=$('#s_d').value,n=$('#s_n').value.trim(),ids=[...$('#s_e').selectedOptions].map(o=>o.value);if(!d||!n||!ids.length)return alert('Informe data, feriado e ao menos um colaborador.');

 if(!S.hol.some(h=>h.date===d))S.hol.push({date:d,name:n});save(`Horário especial de ${n} (${br(d)}) para ${ids.length-skip.length} colaborador(es)`)}

function dataV(){const n=IMP.emps.filter(e=>!S.emps.some(x=>x.reg===e.reg)),fl=IMP.emps.filter(e=>/revisar|incompleta|fora da regra/.test(e.obs));
 return `<div class=card><h3>Importar planilha ESCALA_FEIRA</h3><p>${IMP.emps.length} colaboradores reconhecidos (${IMP.emps.filter(e=>e.active).length} ativos, ${IMP.emps.filter(e=>!e.active).length} inativos) e ${IMP.evs.length} lançamentos (folgas compensatórias, horários de feriado e ajustes). ${n.length} ainda não cadastrados. Rodar de novo não duplica.</p><button ${n.length?'':'disabled'} onclick="imp()">Revisar e importar</button></div><div class="card wrap"><h3>Registros para revisão (${fl.length})</h3><table>${fl.map(e=>`<tr><td>${esc(e.reg)}</td><td>${esc(e.name)}</td><td>${e.active?'':'inativo · '}${esc(e.obs)}</td></tr>`).join('')}</table></div><div class=card><h3>Exportar</h3><button onclick="exp()">Baixar colaboradores (CSV)</button></div>`}
async function imp(){const n=IMP.emps.filter(e=>!S.emps.some(x=>x.reg===e.reg)),ks=new Set(n.map(e=>e.reg)),demo=S.emps.filter(e=>/\(exemplo\)/.test(e.name));
 if(!await ask(`Importar <b>${n.length}</b> colaboradores e os lançamentos deles?${demo.length?'<br>Os cadastros de exemplo serão removidos.':''}<br>Nada é sobrescrito; registros existentes com a mesma matrícula são mantidos.`))return;
 const ids=new Set(demo.map(e=>e.id));S.emps=S.emps.filter(e=>!ids.has(e.id));S.evs=S.evs.filter(x=>!ids.has(x.eid));const m={};
 n.forEach(e=>{const{key,in_,...r}=e,id=uid();m[e.reg]=id;S.emps.push({...r,in:in_,id})});
 IMP.evs.forEach(x=>{if(!ks.has(x.key))return;const{key,name,...r}=x;S.evs.push({...r,id:uid(),eid:m[x.key]})});
 save(`Importação da planilha: ${n.length} colaboradores e ${IMP.evs.filter(x=>ks.has(x.key)).length} lançamentos`)}
async function exp(){try{const dl=await claude.use('downloads');const c='matricula;nome;setor;turno;entrada;intervalo;retorno;saida;folga_fixa;domingo;ref;inicio;ativo\n'+S.emps.map(e=>[e.reg,e.name,e.sector,e.shift,e.in,e.lunch,e.ret,e.out,DS[e.off],e.sun,e.ref,e.start,e.active!==false].join(';')).join('\n');await dl.save({filename:'colaboradores.csv',data:new Blob(['\ufeff'+c],{type:'text/csv'})})}catch(x){alert('Download indisponível: '+(x.message||x))}}
